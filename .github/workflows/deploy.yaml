
name: Deploy to remote server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set environment variables
        run: |
          OWNER_LOWER="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${OWNER_LOWER}/radio-capture:latest" >> $GITHUB_ENV
          echo "GHCR_USERNAME=${OWNER_LOWER}" >> $GITHUB_ENV
          echo "GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "ENABLE_RADIO_LOGS=${{ vars.ENABLE_RADIO_LOGS || 'false' }}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SEHEL_SSH_KEY }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,OPENAI_API_KEY,ENABLE_RADIO_LOGS
          script: |
            set -u
            cd /home/mindlin/radio_capture

            # docker-compose.yaml is read from this checkout, so a failed update
            # silently deploys the new image against an old compose file.
            # channels.json is gitignored and therefore untouched by this.
            REPO_STALE=0
            git fetch origin main
            if git merge --ff-only origin/main; then
              echo "Checkout updated to $(git rev-parse --short HEAD)"
            else
              REPO_STALE=1
              echo "::error::git checkout at /home/mindlin/radio_capture could NOT be fast-forwarded"
              echo "::error::Local commits not on origin/main:"
              git log --oneline origin/main..HEAD || true
              echo "::error::Deploying with a STALE docker-compose.yaml ($(git rev-parse --short HEAD))"
            fi

            docker login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
            docker pull "$IMAGE_NAME"
            docker rm -f radio-capture || true
            docker image prune -f

            DEPLOY_OK=1

            # The watcher reserves an nvidia device, so a broken driver stops it
            # from starting at all — which silently kills the whole ASR pipeline.
            # Probe with nvidia-container-cli: it is the tool docker actually uses,
            # and it exists on this headless host, where nvidia-smi does not.
            if command -v nvidia-container-cli >/dev/null 2>&1; then
              if nvidia-container-cli info >/dev/null 2>&1; then
                echo "OK: GPU usable by the container runtime"
                nvidia-container-cli info 2>&1 | grep -iE 'NVRM|CUDA|Model' | head -3
              else
                DEPLOY_OK=0
                echo "::error::nvidia-container-cli cannot initialise — the GPU-reserving watcher container cannot start"
                nvidia-container-cli info 2>&1 | head -5
                echo "::error::Loaded kernel module: $(cat /proc/driver/nvidia/version 2>/dev/null | head -1)"
                echo "::error::Userspace NVML: $(readlink -f /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1 2>/dev/null)"
                echo "::error::If those two versions differ, the driver was upgraded without the matching"
                echo "::error::kernel module. Check: grep -i nvidia /var/log/apt/history.log"
              fi
            else
              echo "Note: nvidia-container-cli not found on host — skipping GPU check"
            fi

            # Keep going even if compose fails, so the checks below can report
            # exactly which container is down and why.
            IMAGE_NAME="$IMAGE_NAME" OPENAI_API_KEY="$OPENAI_API_KEY" ENABLE_RADIO_LOGS="$ENABLE_RADIO_LOGS" docker compose -f docker-compose.yaml up -d --no-build --pull never || {
              DEPLOY_OK=0
              echo "::error::docker compose up failed"
            }

            # Post-deploy verification. Without this, the containers can come up
            # in a state where no summary can ever be sent and nothing says so.
            sleep 10
            docker compose -f docker-compose.yaml ps

            for c in radio-capture radio-capture-watcher; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null)" = "true" ]; then
                echo "OK: $c is running"
              else
                echo "::error::$c is NOT running after deploy"
                docker logs --tail 40 "$c" 2>&1 || true
                DEPLOY_OK=0
              fi
            done

            # The summary bot only posts if cron was configured from the mounted
            # channels.json. Print the schedule line only — the file holds the API key.
            if docker exec radio-capture test -f /config/channels.json; then
              echo "OK: /config/channels.json is mounted"
            else
              echo "::error::/config/channels.json is missing in the container — cron is disabled, NO summaries will be sent"
              DEPLOY_OK=0
            fi

            if docker exec radio-capture test -f /etc/cron.d/radio-summary; then
              echo "Cron schedule: $(docker exec radio-capture grep -E '^[^#A-Z]' /etc/cron.d/radio-summary | head -1 | cut -d' ' -f1-5)"
            else
              echo "::error::/etc/cron.d/radio-summary was not created — NO summaries will be sent"
              DEPLOY_OK=0
            fi

            if [ "$REPO_STALE" = "1" ] || [ "$DEPLOY_OK" = "0" ]; then
              echo "Deploy finished with problems — see the errors above"
              exit 1
            fi
            echo "Deploy verified"
